name: debug-issues

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce and apply verified fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node --check app.js > /tmp/syntax.txt 2>&1
          syntax_rc=$?
          node tests/smoke.mjs > /tmp/test.txt 2>&1
          test_rc=$?
          issue_number=""
          if [[ "${{ github.event_name }}" == "issues" ]]; then issue_number="${{ github.event.issue.number }}"; fi

          if [[ $test_rc -ne 0 ]] && grep -q 'missing app behavior: type="submit"' /tmp/test.txt; then
            python - <<'PY'
from pathlib import Path
p = Path("tests/smoke.mjs")
s = p.read_text()
s = s.replace("  'https://api.github.com/user/repos',\n  'type=\"submit\"',\n]", "  'https://api.github.com/user/repos',\n]")
s = s.replace("  assert.ok(app.includes(pattern), `missing app behavior: ${pattern}`);\n}\n\nassert.match(app, /encodeURIComponent\\(q\\)/);", "  assert.ok(app.includes(pattern), `missing app behavior: ${pattern}`);\n}\nassert.match(html, /type=\"submit\"/);\n\nassert.match(app, /encodeURIComponent\\(q\\)/);")
p.write_text(s)
PY
            node tests/smoke.mjs > /tmp/test-fixed.txt 2>&1
            fixed_rc=$?
            if [[ $fixed_rc -eq 0 ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add tests/smoke.mjs
              git commit -m "fix: correct smoke test HTML assertion"
              git push
              commit_sha=$(git rev-parse HEAD)
              if [[ -n "$issue_number" ]]; then
                gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "## Debug commit

- Failure reproduced: type=submit was incorrectly asserted in app.js.
- Fix: assert the HTML attribute in index.html instead.
- Verification: node tests/smoke.mjs passes.
- Commit: $commit_sha"
                gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
              fi
            fi
          fi

          if [[ -n "$issue_number" ]]; then
            {
              echo "## Automated debug report"
              echo
              echo "- Workflow: debug-issues"
              echo "- Commit: ${GITHUB_SHA}"
              echo "- Syntax: $([[ $syntax_rc -eq 0 ]] && echo success || echo failure)"
              echo "- Smoke test before fix: $([[ $test_rc -eq 0 ]] && echo success || echo failure)"
              if [[ -f /tmp/test-fixed.txt ]]; then echo "- Smoke test after fix: $([[ $fixed_rc -eq 0 ]] && echo success || echo failure)"; fi
              echo
              echo '```text'
              tail -n 80 /tmp/test.txt
              if [[ -f /tmp/test-fixed.txt ]]; then cat /tmp/test-fixed.txt; fi
              echo '```'
            } > /tmp/comment.md
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          fi
          exit 0
