name: debug-issues

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug open issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ "${{ github.event_name }}" == "issues" ]]; then
            issues_json="[$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}")]"
          else
            issues_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100")"
          fi

          node --check app.js > /tmp/syntax.txt 2>&1
          syntax_rc=$?
          node tests/smoke.mjs > /tmp/test.txt 2>&1
          test_rc=$?

          runs_json="$(gh run list --repo "${GITHUB_REPOSITORY}" --limit 10 --json databaseId,name,status,conclusion,headSha,url,event)"
          failed_run="$(printf "%s" "$runs_json" | jq -r '[.[] | select(.conclusion=="failure")] | .[0] // empty')"

          debug_report="/tmp/debug-report.md"
          {
            echo "## Automated debug report"
            echo
            echo "- Workflow: `debug-issues`"
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Event: `${GITHUB_EVENT_NAME}`"
            echo
            echo "### Local reproduction"
            echo
            if [[ $syntax_rc -eq 0 ]]; then
              echo "- `node --check app.js`: **success**"
            else
              echo "- `node --check app.js`: **failure**"
            fi
            if [[ $test_rc -eq 0 ]]; then
              echo "- `node tests/smoke.mjs`: **success**"
            else
              echo "- `node tests/smoke.mjs`: **failure**"
            fi
            echo
            echo "### Test output"
            echo
            echo '```text'
            tail -n 80 /tmp/test.txt
            echo '```'
            echo
            echo "### Latest failed Actions run"
            if [[ -n "$failed_run" ]]; then
              run_id="$(printf "%s" "$failed_run" | jq -r '.databaseId')"
              run_url="$(printf "%s" "$failed_run" | jq -r '.url')"
              echo "- Run: $run_url"
              jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
              failed_job_id="$(printf "%s" "$jobs" | jq -r '[.jobs[] | select(.conclusion=="failure")] | .[0].id // empty')"
              failed_job_name="$(printf "%s" "$jobs" | jq -r '[.jobs[] | select(.conclusion=="failure")] | .[0].name // empty')"
              if [[ -n "$failed_job_id" ]]; then
                echo "- Job: `${failed_job_name}`"
                echo
                echo '```text'
                gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${failed_job_id}/logs" 2>/dev/null | tail -n 120
                echo
                echo '```'
              else
                echo "- Failed job logs: unavailable"
              fi
            else
              echo "- No failed Actions run found in the latest 10 runs."
            fi
          } > "$debug_report"

          printf "%s" "$issues_json" | jq -c '.[]' | while read -r issue; do
            number="$(printf "%s" "$issue" | jq -r '.number')"
            title="$(printf "%s" "$issue" | jq -r '.title')"
            {
              echo "### Issue #${number}: ${title}"
              echo
              cat "$debug_report"
              echo
              echo "> This workflow records evidence only. It does not modify source files."
            } > /tmp/comment.md
            gh issue comment "$number" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          done

          exit 0
