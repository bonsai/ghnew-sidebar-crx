name: issue-on-test-failure

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]

permissions:
  issues: write
  actions: read

jobs:
  create-issue:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse debug issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="debug: test failure in run ${{ github.event.workflow_run.id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "debug: test failure" --json number,title --limit 1)
          if [[ $(printf '%s' "$existing" | jq 'length') -eq 0 ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "bug" --body "## Automated failure

- Run: ${{ github.event.workflow_run.html_url }}
- Head SHA: ${{ github.event.workflow_run.head_sha }}

The debug workflow may apply only a verified minimal fix."
          fi
