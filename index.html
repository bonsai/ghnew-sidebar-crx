<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GH New</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><strong>🌱 GH New</strong><small>repo first, then new</small></header>
    <label>Owner
      <input id="owner" value="bonsai" autocomplete="off">
    </label>
    <label>Repository name
      <input id="repo-name" name="name" placeholder="my-new-idea" autocomplete="off">
    </label>
    <div id="status" class="status">名前を入力するとチェックします</div>
    <button id="new" disabled>New Repository</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
